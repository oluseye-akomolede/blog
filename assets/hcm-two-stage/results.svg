<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t">
  <title id="t">Scatter plot of the four models, BDD100K validation IoU on the horizontal axis against COCO validation IoU on the vertical. Both axes gain upward and to the right. The dashed line is the gate at COCO 77.28, one point below the model in use. The model in use, marked with a square, sits at 72.29 and 78.28. The 1:1 mix sits at 81.82 and 76.13 and fails the gate. The 3:1 mix sits at 81.16 and 76.90 and fails the gate. The two-stage model sits at 82.56 and 79.39 and is the only point above the line.</title>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">

    <g stroke="#eaeef2" stroke-width="1">
      <line x1="110" y1="387.3" x2="900" y2="387.3"/>
      <line x1="110" y1="314.5" x2="900" y2="314.5"/>
      <line x1="110" y1="241.8" x2="900" y2="241.8"/>
      <line x1="110" y1="169.1" x2="900" y2="169.1"/>
      <line x1="110" y1="96.4" x2="900" y2="96.4"/>
    </g>

    <g stroke="#d0d7de" stroke-width="1.2">
      <line x1="110" y1="60" x2="110" y2="460"/>
      <line x1="110" y1="460" x2="900" y2="460"/>
    </g>

    <g fill="#57606a">
      <text x="320.7" y="478" text-anchor="middle">74</text>
      <text x="426.0" y="478" text-anchor="middle">76</text>
      <text x="531.3" y="478" text-anchor="middle">78</text>
      <text x="636.7" y="478" text-anchor="middle">80</text>
      <text x="742.0" y="478" text-anchor="middle">82</text>
      <text x="847.3" y="478" text-anchor="middle">84</text>
      <text x="102" y="391.3" text-anchor="end">76</text>
      <text x="102" y="318.5" text-anchor="end">77</text>
      <text x="102" y="245.8" text-anchor="end">78</text>
      <text x="102" y="173.1" text-anchor="end">79</text>
      <text x="102" y="100.4" text-anchor="end">80</text>
    </g>

    <text x="505" y="500" text-anchor="middle" fill="#57606a">BDD100K validation IoU, this repository's metric</text>
    <text x="42" y="260" text-anchor="middle" fill="#57606a" transform="rotate(-90 42 260)">COCO validation IoU</text>

    <line x1="110" y1="294.2" x2="900" y2="294.2" stroke="#57606a" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="894" y="286" text-anchor="end" fill="#57606a">gate: COCO val 77.28</text>

    <rect x="223.6" y="214.5" width="14" height="14" fill="#57606a"/>
    <circle cx="732.5" cy="377.8" r="6.5" fill="#57606a"/>
    <circle cx="697.8" cy="321.8" r="6.5" fill="#57606a"/>
    <circle cx="771.4" cy="140.5" r="6.5" fill="#8250df"/>

    <text x="250" y="214" font-weight="600">model in use</text>
    <text x="250" y="232">72.29 / 78.28</text>

    <text x="686" y="330" text-anchor="end" font-weight="600">3:1 mix</text>
    <text x="686" y="348" text-anchor="end">81.16 / 76.90</text>

    <text x="744" y="372" font-weight="600">1:1 mix</text>
    <text x="744" y="390">81.82 / 76.13</text>

    <text x="755" y="128" text-anchor="end" font-weight="600">two stages</text>
    <text x="755" y="146" text-anchor="end">82.56 / 79.39</text>

    <g fill="#57606a">
      <text x="16" y="530">Every model is scored at 352 by 352 on the same grid; the two-stage model's 176 by 176 output is upsampled before scoring.</text>
      <text x="16" y="550">Up and right is better on both axes. The square marks the model in use, which is what the gate is measured against.</text>
    </g>
  </g>
</svg>
