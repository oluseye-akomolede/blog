<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" width="1160" height="460" role="img" aria-labelledby="t">
  <title id="t">One ISC block: three 1 by 1 branches, a 3 by 3 and 5 by 5 pair summed, a second pair multiplied as a gate, group normalisation, a 3 by 3 convolution, and a shortcut added to the output. Input and output are 32 channels at 88 by 88.</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">

    <rect x="10" y="205" width="120" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="70" y="226" text-anchor="middle">input</text>
    <text x="70" y="243" text-anchor="middle">128×88×88</text>

    <rect x="210" y="70" width="100" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="260" y="97" text-anchor="middle">1×1 conv</text>

    <rect x="210" y="190" width="100" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="260" y="217" text-anchor="middle">1×1 conv</text>
    <rect x="350" y="190" width="80" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="390" y="217" text-anchor="middle">3×3</text>

    <rect x="210" y="300" width="100" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="260" y="327" text-anchor="middle">1×1 conv</text>
    <rect x="350" y="300" width="80" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="390" y="327" text-anchor="middle">5×5</text>

    <rect x="470" y="245" width="60" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="500" y="272" text-anchor="middle">sum</text>

    <rect x="570" y="180" width="80" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="610" y="207" text-anchor="middle">3×3</text>
    <rect x="570" y="310" width="80" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="610" y="337" text-anchor="middle">5×5</text>

    <rect x="680" y="245" width="50" height="44" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="705" y="272" text-anchor="middle">×</text>

    <rect x="760" y="245" width="70" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="795" y="272" text-anchor="middle">GN</text>

    <rect x="860" y="245" width="70" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="895" y="272" text-anchor="middle">3×3</text>

    <rect x="970" y="245" width="50" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="995" y="272" text-anchor="middle">+</text>

    <rect x="1050" y="245" width="100" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1100" y="272" text-anchor="middle">out 32</text>

    <rect x="640" y="70" width="140" height="22" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="0.8"/>
    <text x="710" y="85" text-anchor="middle" font-size="11">shortcut</text>

    <g fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)">
      <polyline points="130,230 160,230 160,92 208,92"/>
      <polyline points="130,230 160,230 160,212 208,212"/>
      <polyline points="130,230 160,230 160,322 208,322"/>
      <line x1="310" y1="212" x2="348" y2="212"/>
      <line x1="310" y1="322" x2="348" y2="322"/>
      <polyline points="430,212 450,212 450,260 468,260"/>
      <polyline points="430,322 450,322 450,274 468,274"/>
      <polyline points="530,267 550,267 550,202 568,202"/>
      <polyline points="530,267 550,267 550,332 568,332"/>
      <polyline points="650,202 665,202 665,255 678,255"/>
      <polyline points="650,332 665,332 665,279 678,279"/>
      <line x1="730" y1="267" x2="758" y2="267"/>
      <line x1="830" y1="267" x2="858" y2="267"/>
      <line x1="930" y1="267" x2="968" y2="267"/>
