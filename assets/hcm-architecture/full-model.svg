    <rect x="470" y="455" width="120" height="22" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="0.8"/>
    <text x="530" y="470" text-anchor="middle" font-size="11">c2, projected 96→32</text>
  </g>
