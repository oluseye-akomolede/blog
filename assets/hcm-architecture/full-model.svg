      <line x1="560" y1="390" x2="598" y2="390"/>
      <polyline points="500,65 500,27 598,27"/>
      <polyline points="660,115 660,142 738,142"/>
      <polyline points="700,190 720,190 720,155 738,155"/>
      <line x1="795" y1="164" x2="795" y2="198"/>
      <polyline points="700,290 720,290 720,235 738,235"/>
      <line x1="795" y1="244" x2="795" y2="278"/>
      <polyline points="700,390 720,390 720,315 738,315"/>
      <polyline points="710,27 735,27 735,112 878,112"/>
      <polyline points="700,90 760,90 760,100 878,100"/>
      <line x1="935" y1="134" x2="935" y2="178"/>
      <polyline points="850,142 865,142 865,200 878,200"/>
      <line x1="935" y1="224" x2="935" y2="268"/>
      <polyline points="850,222 865,222 865,292 878,292"/>
      <line x1="935" y1="314" x2="935" y2="358"/>
      <polyline points="850,302 865,302 865,382 878,382"/>
      <line x1="935" y1="404" x2="935" y2="448"/>
      <polyline points="355,415 355,470 870,470 870,478 878,478"/>
      <line x1="970" y1="508" x2="970" y2="543"/>
