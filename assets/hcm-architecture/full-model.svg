    <rect x="880" y="180" width="110" height="44" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="935" y="207" text-anchor="middle">RRD2 → p2</text>
    <rect x="880" y="270" width="110" height="44" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="935" y="297" text-anchor="middle">RRD1 → p1</text>
    <rect x="880" y="360" width="110" height="44" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="935" y="387" text-anchor="middle">RRD0 → p0</text>

    <rect x="880" y="450" width="180" height="58" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="970" y="472" text-anchor="middle">refine: up×2 ⊕ proj(c2)</text>
    <text x="970" y="490" text-anchor="middle">32×176×176</text>

    <rect x="880" y="545" width="180" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="970" y="566" text-anchor="middle">1×1 head</text>
    <text x="970" y="583" text-anchor="middle">logits 2×176×176</text>

    <g fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)">
