    <text x="205" y="246" text-anchor="middle">four feature maps</text>
    <text x="205" y="264" text-anchor="middle">classifier discarded</text>

    <rect x="300" y="65"  width="110" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="355" y="94" text-anchor="middle">c5 768×11×11</text>
    <rect x="300" y="165" width="110" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="355" y="194" text-anchor="middle">c4 384×22×22</text>
    <rect x="300" y="265" width="110" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="355" y="294" text-anchor="middle">c3 192×44×44</text>
    <rect x="300" y="365" width="110" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="355" y="394" text-anchor="middle">c2 96×88×88</text>

    <rect x="440" y="65"  width="120" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="500" y="86" text-anchor="middle">Neck → r5</text>
    <text x="500" y="103" text-anchor="middle">128×88×88</text>
    <rect x="440" y="165" width="120" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="500" y="186" text-anchor="middle">Neck → r4</text>
