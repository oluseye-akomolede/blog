<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-labelledby="t">
  <title id="t">HCM full model: ConvNeXt V2-Tiny backbone, neck, four ISC blocks, three CSC blocks, ASPP, four RRD blocks, mask refinement and segmentation head. Shapes are for a 352 by 352 input.</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
