    <rect x="440" y="365" width="120" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="500" y="386" text-anchor="middle">Neck → r2</text>
    <text x="500" y="403" text-anchor="middle">128×88×88</text>

    <rect x="600" y="65"  width="100" height="50" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="650" y="94" text-anchor="middle">ISC3</text>
    <rect x="600" y="165" width="100" height="50" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="650" y="194" text-anchor="middle">ISC2</text>
    <rect x="600" y="265" width="100" height="50" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="650" y="294" text-anchor="middle">ISC1</text>
    <rect x="600" y="365" width="100" height="50" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="650" y="394" text-anchor="middle">ISC0</text>

    <rect x="600" y="5" width="110" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="655" y="23" text-anchor="middle">ASPP</text>
    <text x="655" y="39" text-anchor="middle">rates 6, 12, 18</text>

    <rect x="740" y="120" width="110" height="44" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
