<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t">
  <title id="t">One CSC block: two inputs are group normalised, the coarser one is upsampled and added to form S, which is pooled to 16 by 16, normalised, passed through joint self-attention, upsampled, positionally normalised (PONO), and added back to S.</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">

    <rect x="10" y="40" width="130" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="75" y="61" text-anchor="middle">f_s</text>
    <text x="75" y="78" text-anchor="middle">32×88×88</text>
    <rect x="180" y="40" width="60" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="210" y="70" text-anchor="middle">GN</text>

    <rect x="10" y="200" width="130" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="75" y="221" text-anchor="middle">f_coarse</text>
    <text x="75" y="238" text-anchor="middle">32×88×88</text>
    <rect x="180" y="200" width="60" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="210" y="230" text-anchor="middle">GN</text>
    <rect x="270" y="200" width="100" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="320" y="230" text-anchor="middle">upsample to f_s</text>

    <rect x="420" y="110" width="60" height="60" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="450" y="145" text-anchor="middle">+</text>
    <rect x="425" y="178" width="50" height="22" rx="3" fill="#f6f8fa" stroke="#57606a" stroke-width="0.8"/>
    <text x="450" y="193" text-anchor="middle" font-size="11">S</text>

    <rect x="520" y="115" width="130" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="585" y="145" text-anchor="middle">avgpool 16×16</text>

    <rect x="680" y="115" width="60" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="710" y="145" text-anchor="middle">GN</text>

    <rect x="770" y="100" width="150" height="80" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="845" y="132" text-anchor="middle">JointAttention</text>
    <text x="845" y="150" text-anchor="middle">8 heads × 4 ch</text>
    <text x="845" y="168" text-anchor="middle">over 256 positions</text>

    <rect x="950" y="115" width="130" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1015" y="145" text-anchor="middle">upsample ×5.5</text>

    <rect x="950" y="205" width="130" height="50" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="1015" y="235" text-anchor="middle">PONO</text>

    <rect x="950" y="290" width="60" height="50" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="980" y="320" text-anchor="middle">+</text>

    <rect x="1030" y="293" width="60" height="44" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="1060" y="320" text-anchor="middle">out</text>

    <g fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)">
      <line x1="140" y1="65" x2="178" y2="65"/>
      <line x1="140" y1="225" x2="178" y2="225"/>
      <line x1="240" y1="225" x2="268" y2="225"/>
      <polyline points="240,65 400,65 400,140 418,140"/>
      <polyline points="370,225 400,225 400,160 418,160"/>
      <line x1="480" y1="140" x2="518" y2="140"/>
      <line x1="650" y1="140" x2="678" y2="140"/>
      <line x1="740" y1="140" x2="768" y2="140"/>
      <line x1="920" y1="140" x2="948" y2="140"/>
      <line x1="1015" y1="165" x2="1015" y2="203"/>
      <line x1="1015" y1="255" x2="1015" y2="288"/>
      <polyline points="450,170 450,315 948,315"/>
      <line x1="1010" y1="315" x2="1028" y2="315"/>
    </g>
  </g>
</svg>
