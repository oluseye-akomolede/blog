<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t">
  <title id="t">One order from plan to play: the player's chat order goes to the L3 planner, which plans once and turns each subtask into a directive; the directive goes straight to the mod, which plays it every server tick under hard limits of max_iterations, 32 nested skill calls and 500 actions per run; the result and progress return over HTTP, and the L2 orchestrator checks the world state first, then the last action, then optionally asks a model yes or no, and moves on, retries or re-plans. Every planner call and its outcome goes to the trajectory log, which an off-loop skill author generalizes into new JSON skills; those are validated for known step types, no self-reference and a depth cap of 64, then stored and never run at registration.</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">

    <rect x="16" y="40" width="120" height="120" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="76" y="64" text-anchor="middle" font-weight="600">order</text>
    <text x="76" y="84" text-anchor="middle" font-size="12">chat, in plain</text>
    <text x="76" y="102" text-anchor="middle" font-size="12">English, from</text>
    <text x="76" y="120" text-anchor="middle" font-size="12">the player</text>

    <rect x="170" y="40" width="180" height="120" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="260" y="64" text-anchor="middle" font-weight="600">L3 plans once</text>
    <text x="260" y="86" text-anchor="middle" font-size="12">order becomes a plan</text>
    <text x="260" y="108" text-anchor="middle" font-size="12">each subtask becomes</text>
    <text x="260" y="130" text-anchor="middle" font-size="12">one directive</text>

    <rect x="598" y="40" width="200" height="120" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="698" y="64" text-anchor="middle" font-weight="600">the mod plays it</text>
    <text x="698" y="84" text-anchor="middle" font-size="12">every server tick</text>
    <text x="698" y="102" text-anchor="middle" font-size="12">max_iterations per loop</text>
    <text x="698" y="120" text-anchor="middle" font-size="12">32 nested calls</text>
    <text x="698" y="138" text-anchor="middle" font-size="12">500 actions per run</text>

    <rect x="832" y="40" width="152" height="120" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="908" y="64" text-anchor="middle" font-weight="600">report</text>
    <text x="908" y="84" text-anchor="middle" font-size="12">result and</text>
    <text x="908" y="102" text-anchor="middle" font-size="12">progress</text>
    <text x="908" y="120" text-anchor="middle" font-size="12">over HTTP</text>

    <rect x="560" y="200" width="424" height="80" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="772" y="224" text-anchor="middle" font-weight="600">L2 checks the outcome</text>
    <text x="772" y="244" text-anchor="middle" font-size="12">world state first, then the last</text>
    <text x="772" y="262" text-anchor="middle" font-size="12">action, then a model yes or no</text>

    <rect x="170" y="296" width="220" height="72" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="280" y="318" text-anchor="middle" font-weight="600">validator</text>
    <text x="280" y="336" text-anchor="middle" font-size="12">known step types only</text>
    <text x="280" y="352" text-anchor="middle" font-size="12">no self-reference</text>
    <text x="280" y="366" text-anchor="middle" font-size="12">depth cap 64</text>

    <rect x="440" y="296" width="180" height="72" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.6"/>
    <text x="530" y="320" text-anchor="middle" font-weight="600">skill author</text>
    <text x="530" y="340" text-anchor="middle" font-size="12">off the live loop</text>
    <text x="530" y="357" text-anchor="middle" font-size="12">routines become skills</text>

    <rect x="700" y="296" width="240" height="72" rx="5" fill="#f6f8fa" stroke="#57606a"/>
    <text x="820" y="320" text-anchor="middle" font-weight="600">trajectory log</text>
    <text x="820" y="340" text-anchor="middle" font-size="12">every planner call</text>
    <text x="820" y="357" text-anchor="middle" font-size="12">and its outcome</text>

    <g fill="none" stroke="#57606a" stroke-width="1.3" marker-end="url(#ar)">
      <line x1="138" y1="100" x2="168" y2="100"/>
      <line x1="352" y1="100" x2="596" y2="100"/>
      <line x1="800" y1="100" x2="830" y2="100"/>
      <line x1="908" y1="162" x2="908" y2="198"/>
      <polyline points="558,240 260,240 260,164"/>
      <line x1="700" y1="332" x2="624" y2="332"/>
      <line x1="438" y1="332" x2="394" y2="332"/>
      <line x1="168" y1="332" x2="146" y2="332"/>
    </g>

    <text x="474" y="92" text-anchor="middle" font-size="12">directive</text>
    <text x="400" y="232" text-anchor="middle" font-size="12">move on, retry or re-plan</text>
    <text x="662" y="324" text-anchor="middle" font-size="12">feeds</text>
    <text x="416" y="288" text-anchor="middle" font-size="12">registers</text>
    <text x="140" y="352" text-anchor="end" font-size="12">stored,</text>
    <text x="140" y="368" text-anchor="end" font-size="12">never run</text>

    <text x="16" y="404" font-size="12">Purple outline marks a model call. The tick loop is plain code.</text>
  </g>
</svg>
